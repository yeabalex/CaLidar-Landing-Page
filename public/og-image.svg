<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark futuristic gradient background -->
  <rect width="1200" height="630" fill="#060608"/>
  
  <!-- Ambient background glow elements -->
  <circle cx="200" cy="150" r="350" fill="#84cc16" fill-opacity="0.12" filter="blur(140px)"/>
  <circle cx="1000" cy="450" r="400" fill="#863bff" fill-opacity="0.16" filter="blur(160px)"/>
  <circle cx="600" cy="300" r="250" fill="#22c55e" fill-opacity="0.08" filter="blur(120px)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.15">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Left Side Content -->
  <!-- Brand Logo & Pill -->
  <g transform="translate(100, 90)">
    <rect width="210" height="42" rx="21" fill="#171717" stroke="#333333" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="7" fill="#84cc16"/>
    <circle cx="24" cy="21" r="11" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="44" y="26" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CALIDAR • BETA</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="215" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
    Your meals.
  </text>
  <text x="100" y="280" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
    Your metrics.
  </text>
  <text x="100" y="345" fill="#84cc16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
    Your world.
  </text>

  <!-- Subheadline -->
  <text x="100" y="415" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    3D LiDAR Volumetric Scanning • Sub-Second AI Recognition
  </text>
  <text x="100" y="445" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    100% On-Device Privacy • Multi-Device Live Sync
  </text>

  <!-- Trust badges -->
  <g transform="translate(100, 500)">
    <!-- Star Rating -->
    <rect width="180" height="44" rx="14" fill="#121212" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">★★★★★</text>
    <text x="95" y="27" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">4.9 / 5.0</text>

    <!-- Speed Badge -->
    <g transform="translate(200, 0)">
      <rect width="180" height="44" rx="14" fill="#121212" stroke="#27272a" stroke-width="1"/>
      <circle cx="28" cy="22" r="6" fill="#84cc16"/>
      <text x="44" y="27" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">0.4s Scan Time</text>
    </g>

    <!-- Privacy Badge -->
    <g transform="translate(400, 0)">
      <rect width="210" height="44" rx="14" fill="#121212" stroke="#27272a" stroke-width="1"/>
      <text x="20" y="27" fill="#84cc16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">🔒</text>
      <text x="44" y="27" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">100% Zero-Data-Cloud</text>
    </g>
  </g>

  <!-- Right Side Mockup Illustration -->
  <g transform="translate(820, 80)">
    <!-- Phone Outer Body -->
    <rect width="280" height="470" rx="48" fill="#0d0d0d" stroke="#27272a" stroke-width="6"/>
    <!-- Phone Screen Inner -->
    <rect x="12" y="12" width="256" height="446" rx="38" fill="#000000"/>
    
    <!-- Dynamic Island -->
    <rect x="85" y="22" width="86" height="20" rx="10" fill="#171717"/>

    <!-- 3D LiDAR Scanner Circle Simulation -->
    <circle cx="128" cy="220" r="70" stroke="#27272a" stroke-width="6" fill="none"/>
    <circle cx="128" cy="220" r="70" stroke="#84cc16" stroke-width="6" stroke-dasharray="320" stroke-dashoffset="80" stroke-linecap="round" fill="none"/>
    
    <!-- Central Scan Icon -->
    <circle cx="128" cy="220" r="50" fill="#121212" stroke="#84cc16" stroke-width="1.5"/>
    <text x="128" y="215" fill="#84cc16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="2">LIDAR 3D</text>
    <text x="128" y="235" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">540 kcal</text>

    <!-- Macro Tags -->
    <g transform="translate(30, 320)">
      <rect width="60" height="28" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="30" y="18" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">42g PRO</text>
    </g>
    <g transform="translate(98, 320)">
      <rect width="60" height="28" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="30" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">38g CHO</text>
    </g>
    <g transform="translate(166, 320)">
      <rect width="60" height="28" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="30" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">12g FAT</text>
    </g>

    <!-- Bottom Button -->
    <rect x="25" y="375" width="206" height="38" rx="14" fill="#84cc16"/>
    <text x="128" y="399" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">SCAN COMPLETE</text>
  </g>
</svg>
